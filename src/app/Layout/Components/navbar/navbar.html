<div class="store-header">

  <!-- LOGO -->
  <img src="assets/img/logotipotienda.png" class="logo-store" (click)="irInicio()">

  <!-- BOTÓN MENÚ CATEGORÍAS -->
  <button mat-icon-button (click)="abrirMenuCategorias()">
    <mat-icon>menu</mat-icon>
  </button>
  <div class="menu-overlay" *ngIf="mostrarMenuCategorias" (click)="cerrarMenuCategorias()"></div>

  <aside class="side-menu" *ngIf="mostrarMenuCategorias">
    <h3>CATEGORÍAS</h3>
    <button (click)="filterByCategory('Todos')"><mat-icon>apps</mat-icon> Todos</button>
    <button (click)="filterByCategory('Cereales')"><mat-icon>inventory_2</mat-icon> Cereales</button>
    <button (click)="filterByCategory('Snacks')"><mat-icon>fastfood</mat-icon> Snacks</button>
    <button (click)="filterByCategory('Detergentes')"><mat-icon>cleaning_services</mat-icon> Limpieza</button>
    <button (click)="filterByCategory('Bebidas')"><mat-icon>local_drink</mat-icon> Bebidas</button>
    <button (click)="filterByCategory('Frutas')"><mat-icon>bakery_dining</mat-icon> Frutas</button>
  </aside>

  <!-- TÍTULO -->
  <span class="header-title">Tienda de Don Pepe</span>
  <span class="spacer"></span>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input
      type="text"
      placeholder="Buscar productos..."
      [(ngModel)]="textoBusqueda"
      (keyup.enter)="buscarProducto()"
    />
    <button (click)="buscarProducto()">Buscar</button>
  </div>

  <!-- CARRITO -->
  <button mat-icon-button color="accent"
          (click)="abrirCarrito()"
          [matBadge]="cartCount"
          matBadgeColor="warn">
    <mat-icon>shopping_cart</mat-icon>
  </button>

  <!-- PERFIL -->
  <button mat-icon-button color="accent"
          [matMenuTriggerFor]="profileMenu"
          style="margin-left:10px">
    <mat-icon>person</mat-icon>
  </button>

  <!-- MENÚ DINÁMICO DE PERFIL -->
  <mat-menu #profileMenu="matMenu">

    <!-- SI EL USUARIO ESTÁ LOGUEADO -->
    <ng-container *ngIf="session">
      <div style="padding: 10px 16px; font-weight: bold; color: #00e599; border-bottom: 1px solid #eee; margin-bottom: 5px;">
        Hola, {{ session.user.nombres }}
      </div>

      <button mat-menu-item (click)="irPerfil()">
        <mat-icon>account_circle</mat-icon> Mi Perfil
      </button>

      <button mat-menu-item (click)="irMisCompras()">
        <mat-icon>shopping_bag</mat-icon> Mis Compras
      </button>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon> Cerrar Sesión
      </button>
    </ng-container>

    <!-- SI NO HAY NADIE LOGUEADO -->
    <ng-container *ngIf="!session">
      <button mat-menu-item (click)="irLogin()">
        <mat-icon>login</mat-icon> Iniciar Sesión
      </button>
      <button mat-menu-item (click)="irRegistro()">
        <mat-icon>person_add</mat-icon> Registrarse
      </button>
    </ng-container>

  </mat-menu>
</div>

<!-- MODAL DEL CARRITO -->
<div class="overlay" *ngIf="mostrarCarrito" (click)="cerrarCarrito()"></div>

<div class="cart-modal" *ngIf="mostrarCarrito">
  <h2>Carrito ({{ cartCount }})</h2>

  <div *ngIf="cartItems.length === 0">
    <p>El carrito está vacío 🛒</p>
  </div>

  <div *ngFor="let item of cartItems" class="cart-item">
    <span>
      {{ item.product.name }} <br />
      {{ item.quantity }} x S/. {{ item.product.price }}
    </span>
    <button class="btn-remove" (click)="remove(item.product.id)">✖</button>
  </div>

  <p class="cart-total">Total: S/. {{ total }}</p>

  <button class="btn-ir-carrito" (click)="irAlCarrito()">
    IR AL CARRITO
  </button>
</div>

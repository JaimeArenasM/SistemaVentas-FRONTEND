<div class="dialog-header">
  <div>
    <span class="dialog-eyebrow">Cliente</span>
    <h2 mat-dialog-title>{{ esEdicion ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
  </div>

  <button mat-icon-button (click)="onCancel()" class="close-btn">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="userForm" class="crm-form">

    <div class="form-row">
      <div class="form-group">
        <label>Nombres</label>
        <input type="text" formControlName="nombres" placeholder="Ej. Juan">
      </div>

      <div class="form-group">
        <label>Apellidos</label>
        <input type="text" formControlName="apellidos" placeholder="Ej. Pérez">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>DNI</label>
        <input type="text" formControlName="dni" placeholder="8 dígitos" maxlength="8">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" formControlName="telefono" placeholder="9 dígitos" maxlength="9">
      </div>
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <input type="text" formControlName="direccion" placeholder="Ej. Av. Principal 123">
    </div>

    <div class="form-row">
      <div class="form-group" [style.grid-column]="esEdicion ? '1 / -1' : 'auto'">
        <label>Correo electrónico</label>
        <input type="email" formControlName="correo" placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group" *ngIf="!esEdicion">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-stroked-button (click)="onCancel()" class="btn-cancel">
    Cancelar
  </button>

  <button mat-raised-button (click)="onSave()" class="btn-save" [disabled]="userForm.invalid">
    {{ esEdicion ? 'Guardar cambios' : 'Guardar usuario' }}
  </button>
</mat-dialog-actions>

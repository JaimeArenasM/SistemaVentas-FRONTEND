<form #productForm="ngForm">
  <h2 mat-dialog-title class="titulo-dialog">
    {{ product.idProducto === 0 || !product.idProducto ? 'Nuevo Producto' : 'Editar Producto' }}
  </h2>

  <div mat-dialog-content class="contenido-dialog">

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Nombre del producto</mat-label>
      <input matInput [(ngModel)]="product.nombre" name="nombre" required #nombre="ngModel" placeholder="Ej. Avena Integral">
      <mat-error *ngIf="nombre.invalid && nombre.touched">El nombre es <strong>obligatorio</strong></mat-error>
    </mat-form-field>

   <div style="display: flex; gap: 16px;">
      <mat-form-field appearance="outline" class="campo" style="flex: 1;">
        <mat-label>Precio (S/)</mat-label>
        <input matInput [(ngModel)]="product.precio" name="precio" type="number" step="0.10" min="0" required #precio="ngModel" (keypress)="soloNumerosYDecimales($event)">
        <mat-error *ngIf="precio.invalid && precio.touched">Ingresa el <strong>precio</strong></mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo" style="flex: 1;">
        <mat-label>Stock inicial</mat-label>
        <input matInput [(ngModel)]="product.stock" name="stock" type="number" min="0" required #stock="ngModel" (keypress)="soloNumerosEnteros($event)">
        <mat-error *ngIf="stock.invalid && stock.touched">Ingresa un <strong>stock válido</strong></mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Categoría</mat-label>
      <mat-select [(ngModel)]="product.idCategoria" name="idCategoria" required #categoria="ngModel">
        <mat-option *ngFor="let cat of categorias" [value]="cat.id">
          {{ cat.nombre }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="categoria.invalid && categoria.touched">La categoría es <strong>obligatoria</strong></mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>URL de imagen</mat-label>
      <input matInput [(ngModel)]="product.imagenUrl" name="imagenUrl" placeholder="https://ejemplo.com/imagen.jpg">
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="3" [(ngModel)]="product.descripcion" name="descripcion"></textarea>
    </mat-form-field>

  </div>

  <div mat-dialog-actions class="acciones-dialog">
    <button mat-stroked-button type="button" class="btn-cancelar" (click)="onCancel()">
      Cancelar
    </button>
    <button mat-raised-button color="primary" type="button" class="btn-guardar" [disabled]="productForm.invalid" (click)="onSave()">
      Guardar
    </button>
  </div>
</form>

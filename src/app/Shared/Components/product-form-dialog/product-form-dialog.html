<h2 mat-dialog-title class="titulo-dialog">
  {{ product.id === 0 ? 'Nuevo Producto' : 'Editar Producto' }}
</h2>

<div mat-dialog-content class="contenido-dialog">

  <mat-form-field appearance="fill" class="campo">
    <mat-label>Nombre del producto</mat-label>
    <input matInput [(ngModel)]="product.name">
  </mat-form-field>

  <mat-form-field appearance="fill" class="campo">
    <mat-label>Precio</mat-label>
    <input matInput [(ngModel)]="product.price" type="number">
  </mat-form-field>

<div class="upload-container">

  <label class="upload-label">Imagen del producto</label>

  <input
    type="file"
    accept="image/*"
    (change)="onFileSelected($event)">

  <button
    mat-raised-button
    class="btn-upload"
    (click)="uploadImage()"
    [disabled]="!selectedFile || uploading">

    {{ uploading ? 'Subiendo...' : 'Subir Imagen' }}

  </button>

  <div class="preview-container" *ngIf="previewUrl">
    <img [src]="previewUrl">
  </div>

  <div class="success" *ngIf="product.image">
    ✓ Imagen subida correctamente
  </div>

</div>

  <mat-form-field appearance="fill" class="campo">
    <mat-label>Descripción</mat-label>
    <textarea matInput rows="3" [(ngModel)]="product.description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="fill" class="campo">
    <mat-label>Categoría</mat-label>
    <input matInput [(ngModel)]="product.category">
  </mat-form-field>

</div>

<div mat-dialog-actions class="acciones-dialog">
  <button mat-stroked-button class="btn-cancelar" (click)="onCancel()">
    Cancelar
  </button>

  <button mat-raised-button class="btn-guardar" (click)="onSave()">
    Guardar
  </button>
</div>

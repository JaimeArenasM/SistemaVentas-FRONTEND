<div class="modal-product">
  <button class="close-btn" (click)="cerrar()">×</button>

  <div class="modal-image">
    <img [src]="product.image" [alt]="product.name">
  </div>

  <div class="modal-info">
    <span class="tag">{{ product.category }}</span>

    <h2>{{ product.name }}</h2>

    <p class="price">S/ {{ product.price }}</p>

    <p class="description">{{ product.description }}</p>

    <p class="stock">✔ Stock disponible: {{ stockDisponible }} unidades</p>

    <div class="quantity-section">
      <label>CANTIDAD</label>

      <div class="quantity-control">
        <button type="button" class="qty-btn" (click)="disminuir()" [disabled]="!puedeDisminuir">−</button>
        <input
          type="number"
          min="1"
          [max]="stockDisponible"
          [value]="cantidad"
          (input)="onCantidadInput($event)"
          aria-label="Cantidad de compra"
        />
        <button type="button" class="qty-btn" (click)="aumentar()" [disabled]="!puedeAumentar">+</button>
      </div>

      <small class="quantity-help">Escribe o ajusta la cantidad que deseas comprar, sin superar el stock disponible.</small>
    </div>

    <button class="add-btn" (click)="agregar()">
      <mat-icon>add_shopping_cart</mat-icon>
      Añadir al carrito
    </button>
  </div>
</div>

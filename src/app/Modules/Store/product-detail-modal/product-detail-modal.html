<div class="modal-product">
  <button class="close-btn" (click)="cerrar()">×</button>

  <div class="modal-image">
    <img [src]="product.imagenUrl || 'https://via.placeholder.com/400'" [alt]="product.nombre">
  </div>

  <div class="modal-info">
    <span class="tag">{{ product.nombreCategoria }}</span>

    <h2>{{ product.nombre }}</h2>

    <p class="price">S/ {{ product.precio }}</p>

    <p class="description">{{ product.descripcion }}</p>

    <p class="stock" [ngStyle]="{'color': product.stock > 0 ? '#4CAF50' : '#f44336'}">
      <mat-icon style="font-size: 16px; height: 16px; width: 16px; vertical-align: middle;">
        {{ product.stock > 0 ? 'check_circle' : 'cancel' }}
      </mat-icon>
      {{ product.stock > 0 ? product.stock + ' disponibles en tienda' : 'Agotado' }}
    </p>

    <div class="quantity-section">
      <label>CANTIDAD</label>

      <div class="quantity-control">
        <button type="button" (click)="disminuir()" [disabled]="product.stock === 0">−</button>
        <span>{{ cantidad }}</span>
        <button type="button" (click)="aumentar()" [disabled]="product.stock === 0">+</button>
      </div>
    </div>

    <button class="add-btn" (click)="agregar()" [disabled]="product.stock === 0">
      <mat-icon>add_shopping_cart</mat-icon>
      Añadir al carrito
    </button>
  </div>
</div>

<div class="product-container">

  <div *ngIf="filteredProducts.length === 0" class="no-products-msg">
    <h3>No se encontraron productos en esta categoría.</h3>
    <button mat-button color="primary" routerLink="/store/productos" [queryParams]="{categoria: 'Todos'}">
      Ver todos los productos
    </button>
  </div>

  <div class="product-grid" *ngIf="filteredProducts.length > 0">
    <mat-card class="product-card" *ngFor="let product of filteredProducts">

      <img mat-card-image [src]="product.imagenUrl || 'https://placehold.co/150x150?text=Sin+Imagen'">

      <mat-card-title>{{ product.nombre }}</mat-card-title>
      <mat-card-subtitle>{{ product.descripcion }}</mat-card-subtitle>

      <mat-card-content>
        <span class="price">S/ {{ product.precio }}</span>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-raised-button color="primary" (click)="abrirModal(product)">
          <mat-icon>add_shopping_cart</mat-icon> Agregar
        </button>
      </mat-card-actions>

    </mat-card>
  </div>
</div>

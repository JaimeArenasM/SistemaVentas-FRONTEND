<div class="carrito-container">

  <div class="carrito-header">
    <button mat-button [routerLink]="['/store/productos']" [queryParams]="{ categoria: 'Todos' }">
      <mat-icon>arrow_back</mat-icon> Volver
    </button>
    <h1>Confirmar Mi Carrito</h1>
  </div>

  <div *ngIf="!cartItems || cartItems.length === 0" class="carrito-vacio">
    <mat-icon>shopping_cart</mat-icon>
    <p>El carrito está vacío</p>

    <button mat-raised-button color="primary" [routerLink]="['/store/productos']" [queryParams]="{ categoria: 'Todos' }">
      Ir a la tienda
    </button>
  </div>

  <div *ngIf="cartItems && cartItems.length > 0" class="carrito-content">

    <div class="cart-items-list">
  <div *ngFor="let item of cartItems" class="cart-item">

    <img [src]="item.imagenUrl || 'https://placehold.co/150?text=Sin+Imagen'"
         [alt]="item.nombreProducto" class="item-image">

    <div class="item-details">
      <h3>{{ item.nombreProducto }}</h3>
      <p>Precio: S/ {{ item.precioUnitario }}</p>
      <p>Cantidad: {{ item.cantidad }}</p>
    </div>

    <div class="item-actions">
      <span class="item-subtotal">S/ {{ item.subtotal | number:'1.2-2' }}</span>

      <button mat-icon-button color="warn" (click)="remove(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </div>

  </div>
</div>

    <div class="cart-summary">
      <h2>Total: S/ {{ totalCarrito }}</h2>

      <button mat-raised-button color="primary" class="btn-pagar" (click)="irAPagar()">
        <mat-icon>payment</mat-icon> Pagar
      </button>
    </div>

  </div>

</div>

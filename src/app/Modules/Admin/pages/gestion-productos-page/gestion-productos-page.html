<h2 class="titulo">Gestión de Productos</h2>

<!-- Le agregamos flex y gap para que los inputs no estén pegados -->
<div class="acciones" style="display: flex; align-items: center; gap: 15px;">

  <!-- 1. Buscador por texto (Actualizado) -->
  <input
    class="buscador"
    [(ngModel)]="textoBusqueda"
    (keyup)="aplicarFiltroCompuesto()"
    placeholder="Buscar producto...">

  <!-- 2. NUEVO: Filtro por categoría -->
  <select
    class="buscador"
    [(ngModel)]="categoriaSeleccionada"
    (change)="aplicarFiltroCompuesto()"
    style="cursor: pointer; min-width: 150px;">
    <option *ngFor="let cat of categorias" [value]="cat">
      {{ cat }}
    </option>
  </select>

  <!-- Espaciador para empujar el botón a la derecha -->
  <span style="flex: 1;"></span>

  <!-- 3. Botón de añadir -->
  <button mat-raised-button color="primary" (click)="abrirModalProducto()">Añadir Producto</button>
</div>

<!-- Tu tabla se queda exactamente igual -->
<table mat-table [dataSource]="dataSource" class="tabla-productos mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let product">{{ product.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let product">{{ product.name }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Precio</th>
    <td mat-cell *matCellDef="let product">S/ {{ product.price }}</td>
  </ng-container>

  <ng-container matColumnDef="image">
    <th mat-header-cell *matHeaderCellDef>Imagen</th>
    <td mat-cell *matCellDef="let product"><img [src]="product.image" class="imagen"></td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let product">{{ product.description }}</td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Categoría</th>
    <td mat-cell *matCellDef="let product">{{ product.category }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let product">
      <button mat-icon-button color="accent" (click)="abrirModalProducto(product)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="eliminar(product)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
